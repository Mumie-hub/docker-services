variables:
  KUBERNETES_CPU_REQUEST: 500m
  KUBERNETES_CPU_LIMIT: 2000m
  KUBERNETES_MEMORY_REQUEST: 2048Mi
  KUBERNETES_MEMORY_LIMIT: 6144Mi

stages:
  - build
  - push
  - renovate


include:
  - '/.gitlab-ci.kaniko.yml'


# jobs ################################
build:jdownloader:
  extends: .kaniko_build_template
  variables:
    ENV: jdownloader

build:rclone-mount:
  extends: .kaniko_build_template
  variables:
    ENV: rclone-mount

build:sabnzbdvpn:
  extends: .kaniko_build_template
  variables:
    ENV: sabnzbdvpn

build:smb-mount:
  extends: .kaniko_build_template
  variables:
    ENV: smb-mount


push:rclone-mount:
  extends: .crane_push_docker_template
  variables:
    ENV: rclone-mount
  needs:
    - job: build:rclone-mount

push:sabnzbdvpn:
  extends: .crane_push_docker_template
  variables:
    ENV: sabnzbdvpn
  needs:
    - job: build:sabnzbdvpn

push:smb-mount:
  extends: .crane_push_docker_template
  variables:
    ENV: smb-mount
  needs:
    - job: build:smb-mount


# runs only in scheduled pipelines, needs the masked CI/CD variables RENOVATE_TOKEN and GITHUB_COM_TOKEN
renovate:
  stage: renovate
  image:
    name: renovate/renovate:44
    entrypoint: [""]
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    KUBERNETES_CPU_REQUEST: 200m
    KUBERNETES_CPU_LIMIT: 1000m
    KUBERNETES_MEMORY_REQUEST: 512Mi
    KUBERNETES_MEMORY_LIMIT: 2048Mi
  script:
    - renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
