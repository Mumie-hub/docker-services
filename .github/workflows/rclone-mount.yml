name: Build and Publish rclone-mount

on:
  push:
    branches:
      - master
      - dev
    paths:
      - 'rclone-mount/**'
      - '.github/workflows/rclone-mount.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: meta
        run: |
          VERSION=$(cat rclone-mount/version | tr -d '[:space:]')
          IMAGE="ghcr.io/${{ github.repository_owner }}/rclone-mount"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

          if [ "${{ github.ref_name }}" = "master" ]; then
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
          else
            TAGS="${IMAGE}:${{ github.ref_name }},${IMAGE}:${{ github.ref_name }}-${VERSION}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./rclone-mount
          file: ./rclone-mount/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
